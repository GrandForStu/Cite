 <style>
      .animation-container {

        width: 200px;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        background: linear-gradient(180deg, #18259b 0%, #fcfff5 50%, #75ef4f 100%);
        border: 2px solid #333;
        border-radius: 10px;
        transform:scale(1)
      }


      .animation-container img {
        position: absolute;
        max-width: 90%;
        max-height: 90%;
        transition: opacity 0.3s ease;
      }

      .img-musk, .img-rocket, .img-musk-WO-finger, .img-finger {
        opacity: 0;
        pointer-events: none;
      }

    .img-initial{

        margin-right: 40%;
        margin-bottom: -20px;
        animation: startshake 1s ease-in-out infinite;
    }
    .img-initialrock{
        margin-left:40%;
        margin-bottom: -20px;
        animation: startjump 1s ease-in-out infinite;
    }

    .img-finger{
       margin-right: 132px;
       margin-top: 35px;
   }

      .animation-container:hover .img-initial { opacity: 0; }
        .animation-container:hover .img-initialrock { opacity: 0; }



.img-rocket{
        width: 60px; height: 70px;
        margin-bottom: 50px;
        margin-right: 80px;
}
.img-musk{
     transform: scale(0.7);
}
.animation-container:hover .img-rocket,
      .animation-container:hover .img-musk
 {
        opacity: 1;
        pointer-events: auto;
      }

     .img-rocket:hover {

        animation: spiral 2s linear infinite;
      }

      .animation-container:active .img-musk,
      .animation-container:active .img-rocket {
        opacity: 0;
      }


      .animation-container:active .img-musk-WO-finger ,
      .animation-container:active .img-finger{

        opacity: 1;
        pointer-events: auto;
        transform-origin:  70% 80%;
      }

      .animation-container:active .img-finger{

          animation: startshake 1s linear infinite;
      }

      .animation-container:active {
        animation: shake-flex 0.5s ease-in-out infinite;
      }

      .anim-text {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 20px;
        font-weight: bold;
        color: #2c2c2c;
        padding: 2px 8px;
        border-radius: 6px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        z-index: 10;
      }

      .animation-container:hover .text-hover
      { opacity: 1; }
      .animation-container:active .text-hover
      { opacity: 0; }
      .animation-container:active .text-active {
          transform: translateX(-180px) translateY(-80px) rotate(-90deg);
          opacity: 1; }

      @keyframes spiral {
        0%   { transform: rotate(0deg) translateX(0px) rotate(0deg); }
        25%  { transform: rotate(180deg) translateX(80px) rotate(-180deg); }
        50%  { transform: rotate(360deg) translateX(80px) rotate(-360deg); }
        75%  { transform: rotate(540deg) translateX(80px) rotate(-540deg); }
        100% { transform: rotate(720deg) translateX(0px) rotate(-720deg); }
      }

      @keyframes shake-flex {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
}
      @keyframes startshake {
      0% {transform: rotate(-15deg);}
      50% {transform: rotate(15deg);}
      100% {transform: rotate(-15deg);}
      }

      @keyframes startjump {
        0%,100% { transform:translateY(0); }
        50%     { transform:translateY(-9px);}
      }

    </style>
    </head>
    <body>

      <img src="pic/var4/mask3.png" alt="Начало маск" class="img-initial">
      <img src="pic/var4/mask4.png" alt="Ракета" class="img-rocket">
